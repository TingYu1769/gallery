<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视觉传达设计社团 · 2026 线上作品展</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="club">视觉传达设计社团</p>
    <h1>2026 线上作品展</h1>
    <p class="note">每位社员一张卡片，投稿方式见仓库 README</p>
  </header>

  <main class="grid">
    <article class="card">
      <div class="cover c1"></div>
      <h2>《方寸》</h2>
      <p class="who">陈屿 · 字体设计</p>
      <p>为社团招新海报设计的一套标题字。</p>
    </article>

    <article class="card">
      <div class="cover c2"></div>
      <h2>《晚安，小猫》</h2>
      <p class="who">周以宁 · 绘本</p>
      <p>十二页的睡前绘本，全部用彩铅画成。</p>
    </article>

    <article class="card">
      <div class="cover c3"></div>
      <h2>《巷口》</h2>
      <p class="who">林玥玥 · 胶片摄影</p>
      <p>一年里在小巷入口拍下的 36 张照片。</p>
    </article>
  </main>

  <footer>vcd-club-2026 · 欢迎社员投稿</footer>
</body>
</html>
