<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视觉传达设计社团 · 2026 线上作品展</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="club">视觉传达设计社团</p>
    <h1>2026 线上作品展</h1>
    <p class="note">每位社员一张卡片，投稿方式见仓库 README，10 月 31 日截止</p>
  </header>

  <main class="grid">
    <article class="card">
      <img class="cover" src="images/fangcun.jpg" alt="网格纸上用黑卡纸剪出的笔画，旁边是刻刀和切割垫" width="1200" height="800" loading="lazy">
      <h2>《方寸》</h2>
      <p class="who">陈屿 · 字体设计</p>
      <p>为社团招新海报设计的一套标题字。</p>
    </article>

    <article class="card">
      <img class="cover" src="images/kitten.jpg" alt="摊开的线圈速写本，铅笔画着窗台上睡觉的小猫" width="1200" height="800" loading="lazy">
      <h2>《晚安，小猫》</h2>
      <p class="who">周以宁 · 绘本</p>
      <p>十二页的睡前绘本，全部用铅笔素描画成。</p>
    </article>

    <article class="card">
      <img class="cover" src="images/alley.jpg" alt="清晨杭州老巷的入口，白墙、盆栽和一辆自行车" width="1200" height="800" loading="lazy">
      <h2>《巷口》</h2>
      <p class="who">林玥玥 · 胶片摄影</p>
      <p>一年里在小巷入口拍下的 36 张照片。</p>
    </article>
  </main>

  <footer>vcd-club-2026 · 欢迎社员投稿</footer>
</body>
</html>
